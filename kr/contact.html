                        2. 설치 스크립트

                    -->

                    <!-- 3. 실행 스크립트 -->
                    <script charset="UTF-8">
                        new daum.roughmap.Lander({

                            "key" : "2dot2",
                            "mapWidth" : "50%",
                            "mapHeight" : "469"
                        }).render();
